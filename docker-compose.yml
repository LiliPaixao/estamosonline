services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      network: host
    container_name: laravel-app
    volumes:
      - ./:/var/www
    networks:
      - laravel-network
    depends_on:
      - db
    
  nginx:
    image: nginx:alpine
    container_name: laravel-nginx
    ports:
      - "80:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laravel-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: laravel-db
    env_file: .env
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - laravel-network



  node:
    image: node:20-alpine
    container_name: laravel-node
    volumes:
      - ./:/var/www
    working_dir: /var/www
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"
    networks:
      - laravel-network


networks:
  laravel-network:
    driver: bridge

volumes:
  dbdata:
    driver: local